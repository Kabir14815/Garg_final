services:
  - type: web
    name: garg-api
    runtime: python
    plan: free
    rootDir: backend
    # Pin deps reliably; avoid implicit Python 3.14 default on new Render services (breaks some wheels).
    buildCommand: pip install --upgrade pip setuptools wheel && pip install -r requirements.txt
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: garg
      - key: PYTHON_VERSION
        value: 3.11.11
